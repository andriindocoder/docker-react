version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub...
      - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

  build:
    commands:
      - echo Building Docker image...
      - docker build -t andriwicaksono/docker-react -f Dockerfile.dev .
      - echo Running tests...
      - docker run -e CI=true andriwicaksono/docker-react npm run test